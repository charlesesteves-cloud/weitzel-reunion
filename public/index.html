<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weitzel Family+ Reunion</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #f5f7fa; font-family: Georgia, serif; min-height: 100vh; }
    .page { max-width: 560px; margin: 0 auto; min-height: 100vh; }

    .hero { background: linear-gradient(135deg, #1a6b9a 0%, #0d4f7a 50%, #1a3a5c 100%); padding: 40px 24px 32px; text-align: center; }
    .hero-icon { font-size: 40px; margin-bottom: 8px; }
    .hero h1 { color: #fff; font-size: 28px; margin-bottom: 8px; letter-spacing: -0.5px; }
    .hero p { color: rgba(255,255,255,0.8); font-size: 14px; font-family: sans-serif; }

    .card { margin: 20px; background: #fff; border-radius: 16px; padding: 24px; box-shadow: 0 2px 20px rgba(0,0,0,0.08); }
    .card h2 { font-size: 22px; font-weight: 700; color: #1a2a3a; margin-bottom: 8px; }
    .card p { font-size: 14px; color: #666; font-family: sans-serif; line-height: 1.5; margin-bottom: 24px; }

    label { display: block; font-size: 13px; font-weight: 600; color: #444; margin-bottom: 8px; font-family: sans-serif; }
    input[type=text] { width: 100%; padding: 12px 14px; font-size: 16px; border: 2px solid #e0e0e0; border-radius: 10px; outline: none; font-family: sans-serif; }
    input[type=text]:focus { border-color: #1a6b9a; }

    .btn-primary { display: block; width: 100%; padding: 14px; background: linear-gradient(135deg, #1a6b9a, #0d4f7a); color: #fff; border: none; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 16px; font-family: sans-serif; }
    .btn-primary:disabled { background: #aaa; cursor: not-allowed; }
    .btn-ghost { display: block; width: 100%; padding: 12px; background: transparent; color: #1a6b9a; border: 2px solid #1a6b9a; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 12px; font-family: sans-serif; }

    .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; background: #fff; border-bottom: 1px solid #eee; position: sticky; top: 0; z-index: 10; }
    .top-bar-name { font-weight: 700; color: #1a2a3a; font-size: 14px; font-family: sans-serif; }
    .top-bar-step { font-size: 12px; color: #888; font-family: sans-serif; }
    .back-btn { background: none; border: none; color: #1a6b9a; font-size: 14px; cursor: pointer; font-family: sans-serif; font-weight: 600; padding: 0; }

    .section-title { font-size: 22px; font-weight: 700; color: #1a2a3a; margin: 24px 0 6px; }
    .section-desc { font-size: 14px; color: #666; margin-bottom: 16px; font-family: sans-serif; line-height: 1.5; }

    .activity-card { background: #fff; border: 2px solid #eee; border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; transition: all 0.15s; }
    .activity-label { font-weight: 700; font-size: 16px; color: #1a2a3a; }
    .activity-desc { font-size: 13px; color: #888; font-family: sans-serif; margin-top: 2px; }
    .suggested-badge { font-size: 11px; background: #fff8e0; color: #7a5a00; border: 1px solid #f0c040; border-radius: 20px; padding: 2px 7px; font-family: sans-serif; font-weight: 600; margin-left: 6px; }
    .vote-buttons { display: flex; gap: 8px; margin-top: 10px; }
    .vote-btn { flex: 1; padding: 8px 4px; border: 2px solid; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; background: #fff; font-family: sans-serif; transition: all 0.15s; }

    .add-card { background: #fff; border: 2px dashed #cce; border-radius: 14px; padding: 16px; margin-top: 8px; }
    .add-card h3 { font-weight: 700; font-size: 15px; color: #1a2a3a; margin-bottom: 4px; font-family: sans-serif; }
    .add-card p { font-size: 12px; color: #888; margin-bottom: 10px; font-family: sans-serif; }
    .add-row { display: flex; gap: 8px; }
    .add-row input { flex: 1; padding: 10px 12px; border: 2px solid #ddd; border-radius: 10px; font-size: 14px; font-family: sans-serif; outline: none; }
    .add-btn { padding: 10px 18px; background: #1a6b9a; color: #fff; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; font-family: sans-serif; }

    .date-card { background: #fff; border: 2px solid #eee; border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; transition: all 0.15s; }
    .date-label { font-weight: 700; font-size: 16px; color: #1a2a3a; margin-bottom: 10px; }
    .slot-row { display: flex; gap: 6px; flex-wrap: wrap; }
    .slot-btn { padding: 10px 8px; border: 2px solid #ddd; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; background: #f8f8f8; font-family: sans-serif; transition: all 0.15s; flex: 1; }

    .success-banner { background: #e6f9ee; border: 1px solid #2ecc71; color: #1a7a45; padding: 12px 16px; margin: 16px 16px 0; border-radius: 10px; font-size: 14px; font-family: sans-serif; font-weight: 600; }
    .error-msg { color: #e74c3c; font-size: 13px; margin-top: 6px; font-family: sans-serif; }

    .tab-row { display: flex; margin: 16px 16px 0; gap: 8px; }
    .tab { flex: 1; padding: 10px; background: #fff; border: 2px solid #ddd; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: sans-serif; color: #888; }
    .tab.active { background: #1a6b9a; color: #fff; border-color: #1a6b9a; }

    .result-card { background: #fff; border: 2px solid #eee; border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; margin-top: 12px; }
    .result-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .result-label { font-weight: 700; font-size: 15px; color: #1a2a3a; }
    .result-count { font-size: 12px; color: #aaa; font-family: sans-serif; }
    .bar-row { display: flex; height: 24px; border-radius: 6px; overflow: hidden; margin-bottom: 8px; gap: 2px; }
    .bar { display: flex; align-items: center; justify-content: center; min-width: 24px; border-radius: 4px; font-size: 11px; color: #fff; font-weight: 700; font-family: sans-serif; }
    .vote-breakdown { display: flex; gap: 6px; flex-wrap: wrap; }
    .vote-chip { font-size: 12px; padding: 3px 8px; border-radius: 20px; font-family: sans-serif; font-weight: 600; border: 1px solid; }

    .avail-chip { flex: 1; min-width: 80px; border: 2px solid; border-radius: 10px; padding: 10px 12px; }
    .avail-count { display: block; font-size: 18px; font-weight: 700; margin: 4px 0; font-family: sans-serif; }
    .avail-bar { height: 6px; background: #eee; border-radius: 3px; margin-top: 6px; }
    .avail-bar-fill { height: 100%; border-radius: 3px; }
    .who-avail { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
    .name-chip { font-size: 12px; background: #f0f4f8; color: #444; padding: 4px 10px; border-radius: 20px; font-family: sans-serif; }
    .busy-badge { font-size: 12px; background: #fde8e8; color: #9a1a1a; padding: 3px 8px; border-radius: 20px; font-family: sans-serif; font-weight: 600; }
    .loading { padding: 40px; text-align: center; color: #888; font-family: sans-serif; }
    .content-pad { padding: 0 16px 40px; }
    .hidden { display: none; }
  </style>
</head>
<body>
<div class="page" id="app"></div>

<script>
const ACTIVITIES = [
  { id: "red_roost", label: "Red Roost", desc: "Classic all-you-can-eat crab house" },
  { id: "house_tour", label: "This Old House Tour", desc: "See where Grandparents lived and other Weitzel sentimental sites" },
  { id: "golf", label: "Golf", desc: "18 holes for the crew, tee times needed" },
  { id: "gokarts_minigolf", label: "Go-Karts & Mini Golf", desc: "Baja Amusements has both in one spot" },
  { id: "paintball", label: "Paintball", desc: "Competitive, chaotic, everyone loves to hate it" },
  { id: "beach_day", label: "Beach Day", desc: "Sun, waves, chairs, coolers — the classic" },
  { id: "park", label: "Park / Zoo", desc: "Salisbury Zoo is free, right next to a great playground" },
  { id: "soccer", label: "Soccer Scrimmage", desc: "Find a local field, split into teams, bring snacks" },
  { id: "boardwalk", label: "Boardwalk + Arcade", desc: "Stroll OC boardwalk, hit Marty's Playland" },
  { id: "margarita", label: "Margarita Night", desc: "Pitchers, guac, whoever wants to host" },
  { id: "daytons", label: "Dayton's", desc: "Local staple, great for a casual group meal" },
  { id: "house_hangout", label: "House Hangout", desc: "Someone opens their place, low-key evening" },
  { id: "beach_walk", label: "Sunrise / Sunset Beach Walk", desc: "Easy, free, multigenerational" },
  { id: "kayak", label: "Kayaking / Paddleboarding", desc: "Bay-side rentals, flat water, all ages" },
  { id: "assateague", label: "Assateague Island", desc: "Wild ponies, beach, nature trails" },
  { id: "fishing", label: "Fishing", desc: "Pier or surf fishing, gear rentals at OC inlet" },
  { id: "bike_ride", label: "Boardwalk Bike Ride", desc: "Early morning, bikes on the boards, big group fun" },
];

const DATES = [
  "Fri 6/26","Sat 6/27","Sun 6/28","Mon 6/29","Tue 6/30",
  "Wed 7/1","Thu 7/2","Fri 7/3","Sat 7/4","Sun 7/5"
];

const VOTES = ["Yes","Maybe","No"];
const VOTE_STYLES = {
  Yes:   { bg:"#e6f9ee", border:"#2ecc71", text:"#1a7a45", emoji:"✓" },
  Maybe: { bg:"#fff8e6", border:"#f0a500", text:"#7a5500", emoji:"~" },
  No:    { bg:"#fde8e8", border:"#e74c3c", text:"#7a1a1a", emoji:"✕" },
};
const SLOTS = ["Day","Night","All Day / All Night!","Too Busy"];
const SLOT_COLORS = {
  Day:        { bg:"#fff8e0", border:"#f0c040", text:"#7a5a00" },
  Night:      { bg:"#eef0ff", border:"#6c7ae0", text:"#2a3080" },
  "All Day / All Night!": { bg:"#edfdf4", border:"#3ecf8e", text:"#1a6645" },
  "Too Busy": { bg:"#fde8e8", border:"#e74c3c", text:"#7a1a1a" },
};

// State
let state = {
  screen: "name",
  name: "",
  activityVotes: {},
  availability: {},
  customActivities: [],
  allData: null,
  saving: false,
  activeTab: "activities",
  submitted: false,
};

function setState(patch) {
  state = { ...state, ...patch };
  render();
}

// API
async function apiGet() {
  const r = await fetch("/api/responses");
  return r.json();
}
async function apiPost(type, payload) {
  const r = await fetch("/api/responses", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ type, payload }),
  });
  return r.json();
}

async function loadCustomActivities() {
  try {
    const data = await apiGet();
    setState({ customActivities: data.customs || [] });
  } catch(e) {}
}

async function loadResults() {
  try {
    const data = await apiGet();
    setState({ allData: data });
  } catch(e) {
    setState({ allData: { responses:[], customs:[] } });
  }
}

async function handleSubmit() {
  setState({ saving: true });
  try {
    await apiPost("submit_response", {
      name: state.name,
      activityVotes: state.activityVotes,
      availability: state.availability,
    });
    setState({ saving: false, submitted: true, screen: "results" });
    loadResults();
  } catch(e) {
    setState({ saving: false });
    alert("Error saving. Please try again.");
  }
}

async function addCustomActivity(label) {
  if (!label.trim()) return;
  const activity = { id: "custom_" + Date.now(), label: label.trim(), desc: "Suggested by " + state.name, addedBy: state.name };
  try {
    await apiPost("add_custom", { activity });
    await loadCustomActivities();
  } catch(e) {
    alert("Couldn't save suggestion.");
  }
}

// Render
function render() {
  const app = document.getElementById("app");
  if (state.screen === "name")         app.innerHTML = renderName();
  else if (state.screen === "activities") app.innerHTML = renderActivities();
  else if (state.screen === "availability") app.innerHTML = renderAvailability();
  else if (state.screen === "results") app.innerHTML = renderResults();
  attachEvents();
}

function renderHero(subtitle) {
  return `<div class="hero">
    <div class="hero-icon">🌊</div>
    <h1>Weitzel Family+ Reunion</h1>
    <p>${subtitle}</p>
  </div>`;
}

function renderName() {
  return `<div>
    ${renderHero("June 27 – July 6 · Ocean City & Salisbury, MD")}
    <div class="card">
      <h2>Weitzel Family+ Reunion</h2>
      <p>Vote on activities, suggest new ones, and mark when you're available.</p>
      <label>Your name</label>
      <input type="text" id="name-input" placeholder="First name is fine" value="${state.name}" />
      <p style="font-size:12px;color:#888;font-family:sans-serif;margin-top:6px">Already responded? Enter your name to update your answers.</p>
      <div id="name-error" class="error-msg" style="display:none"></div>
      <button class="btn-primary" id="btn-start">Get Started →</button>
      <button class="btn-ghost" id="btn-view-results">View Results</button>
    </div>
  </div>`;
}

function renderActivities() {
  const all = [...ACTIVITIES, ...state.customActivities];
  const cards = all.map(act => {
    const vote = state.activityVotes[act.id];
    let cardStyle = "";
    if (vote) cardStyle = `border-color:${VOTE_STYLES[vote].border};background:${VOTE_STYLES[vote].bg}`;
    const badge = act.addedBy ? `<span class="suggested-badge">💡 ${act.addedBy}</span>` : "";
    const btns = VOTES.map(v => {
      const active = vote === v;
      const vs = VOTE_STYLES[v];
      const style = active
        ? `background:${vs.border};color:#fff;border-color:${vs.border}`
        : `color:${vs.text};border-color:${vs.border}`;
      return `<button class="vote-btn" data-id="${act.id}" data-vote="${v}" style="${style}">${vs.emoji} ${v}</button>`;
    }).join("");
    return `<div class="activity-card" style="${cardStyle}">
      <div class="activity-label">${act.label}${badge}</div>
      <div class="activity-desc">${act.desc}</div>
      <div class="vote-buttons">${btns}</div>
    </div>`;
  }).join("");

  return `<div>
    <div class="top-bar">
      <span class="top-bar-name">👋 ${state.name}</span>
      <span class="top-bar-step">Step 1 of 2 · Activities</span>
    </div>
    <div class="content-pad">
      <h2 class="section-title">What sounds good?</h2>
      <p class="section-desc">Vote on each activity — you can change your mind before submitting.</p>
      ${cards}
      <div class="add-card">
        <h3>💡 Suggest an activity</h3>
        <p>Your suggestion is added immediately for everyone to vote on.</p>
        <div class="add-row">
          <input type="text" id="new-activity-input" placeholder="e.g. Sunset cruise, bowling..."/>
          <button class="add-btn" id="btn-add-activity">Add</button>
        </div>
      </div>
      <button class="btn-primary" id="btn-next-avail" style="margin-top:24px">Next: Availability →</button>
    </div>
  </div>`;
}

function renderAvailability() {
  const dateCards = DATES.map(date => {
    const selected = state.availability[date] || [];
    const isBusy = selected.includes("Too Busy");
    const cardStyle = isBusy ? "border-color:#e74c3c;background:#fff5f5" : "";
    const btns = SLOTS.map(slot => {
      const active = selected.includes(slot);
      const sc = SLOT_COLORS[slot];
      const style = active
        ? `background:${sc.border};color:#fff;border-color:${sc.border}`
        : `background:#f8f8f8;color:${sc.text};border-color:#ddd`;
      const label = slot === "Too Busy" ? "😵 Too Busy" : slot;
      const flex = slot === "Too Busy" ? "flex:0 0 auto;font-size:12px" : "";
      return `<button class="slot-btn" data-date="${date}" data-slot="${slot}" style="${style};${flex}">${label}</button>`;
    }).join("");
    return `<div class="date-card" style="${cardStyle}">
      <div class="date-label">${date}</div>
      <div class="slot-row">${btns}</div>
    </div>`;
  }).join("");

  return `<div>
    <div class="top-bar">
      <button class="back-btn" id="btn-back">← Back</button>
      <span class="top-bar-step">Step 2 of 2 · Availability</span>
    </div>
    <div class="content-pad">
      <h2 class="section-title">When are you around?</h2>
      <p class="section-desc">Tap the times that work for you. "Too Busy" marks the whole day.</p>
      ${dateCards}
      <button class="btn-primary" id="btn-submit" style="margin-top:24px;margin-bottom:32px" ${state.saving?"disabled":""}>
        ${state.saving ? "Saving..." : "✓ Submit & See Results"}
      </button>
    </div>
  </div>`;
}

function renderResults() {
  const data = state.allData;
  if (!data) return `<div>${renderHero("Results")}<div class="loading">Loading...</div></div>`;
  const totalResponders = data.responses.length;

  const actTab = state.activeTab === "activities";
  let tabContent = "";

  if (actTab) {
    const allActs = [...ACTIVITIES, ...(data.customs||[])];
    tabContent = allActs.map(act => {
      const totals = { Yes:0, Maybe:0, No:0 };
      for (const r of data.responses) { const v = r.activityVotes?.[act.id]; if(v) totals[v]++; }
      const total = totals.Yes + totals.Maybe + totals.No;
      const badge = act.addedBy ? `<span class="suggested-badge">💡 ${act.addedBy}</span>` : "";
      const bars = total > 0 ? VOTES.map(v => totals[v] > 0
        ? `<div class="bar" style="background:${VOTE_STYLES[v].border};width:${(totals[v]/Math.max(totalResponders,1))*100}%">${VOTE_STYLES[v].emoji} ${totals[v]}</div>`
        : "").join("") : "";
      const chips = VOTES.map(v =>
        `<span class="vote-chip" style="background:${VOTE_STYLES[v].bg};color:${VOTE_STYLES[v].text};border-color:${VOTE_STYLES[v].border}">${VOTE_STYLES[v].emoji} ${v}: ${totals[v]||0}</span>`
      ).join("");
      return `<div class="result-card">
        <div class="result-header">
          <div><span class="result-label">${act.label}</span>${badge}</div>
          <span class="result-count">${total} vote${total!==1?"s":""}</span>
        </div>
        ${total > 0 ? `<div class="bar-row">${bars}</div>` : ""}
        <div class="vote-breakdown">${chips}</div>
      </div>`;
    }).join("");
  } else {
    tabContent = DATES.map(date => {
      const busyCount = data.responses.filter(r=>(r.availability?.[date]||[]).includes("Too Busy")).length;
      const chips = ["Day","Night","All Day / All Night!"].map(slot => {
        const count = data.responses.filter(r=>(r.availability?.[date]||[]).includes(slot)).length;
        const sc = SLOT_COLORS[slot];
        const pct = totalResponders > 0 ? (count/totalResponders)*100 : 0;
        return `<div class="avail-chip" style="background:${sc.bg};border-color:${sc.border};color:${sc.text}">
          <span style="font-weight:700">${slot}</span>
          <span class="avail-count">${count} / ${totalResponders}</span>
          <div class="avail-bar"><div class="avail-bar-fill" style="width:${pct}%;background:${sc.border}"></div></div>
        </div>`;
      }).join("");
      const nameChips = data.responses.map(r => {
        const slots = r.availability?.[date]||[];
        if (!slots.length) return "";
        const busy = slots.includes("Too Busy");
        return `<span class="name-chip" style="${busy?"background:#fde8e8;color:#9a1a1a":""}">${r.name}: ${slots.join(", ")}</span>`;
      }).join("");
      return `<div class="result-card">
        <div class="result-header" style="margin-bottom:6px">
          <span class="result-label">${date}</span>
          ${busyCount > 0 ? `<span class="busy-badge">😵 ${busyCount} too busy</span>` : ""}
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">${chips}</div>
        ${nameChips ? `<div class="who-avail">${nameChips}</div>` : ""}
      </div>`;
    }).join("");
  }

  return `<div>
    ${renderHero(`Results · ${totalResponders} ${totalResponders===1?"response":"responses"} so far`)}
    ${state.submitted ? `<div class="success-banner">🎉 Your response was saved, ${state.name}!</div>` : ""}
    ${data && data.responses.length > 0 ? `
    <div style="padding:12px 16px 0">
      <div style="background:#fff;border:2px solid #eee;border-radius:14px;padding:14px 16px">
        <div style="font-weight:700;font-size:14px;color:#1a2a3a;margin-bottom:10px;font-family:sans-serif">✅ Responded (${data.responses.length})</div>
        <div style="display:flex;flex-wrap:wrap;gap:6px">
          ${data.responses.map(r => `<span style="font-size:13px;background:#e6f9ee;color:#1a7a45;border:1px solid #2ecc71;padding:4px 12px;border-radius:20px;font-family:sans-serif;font-weight:600">${r.name}</span>`).join("")}
        </div>
      </div>
    </div>` : ""}
    <div class="tab-row">
      <button class="tab ${actTab?"active":""}" id="tab-activities">Activities</button>
      <button class="tab ${!actTab?"active":""}" id="tab-availability">Availability</button>
    </div>
    <div class="content-pad">${tabContent}</div>
    <div style="padding:0 16px 40px">
      <button class="btn-ghost" id="btn-another">Submit another response</button>
      <button class="btn-ghost" id="btn-refresh" style="margin-top:8px">🔄 Refresh results</button>
    </div>
  </div>`;
}

function attachEvents() {
  // Name screen
  const btnStart = document.getElementById("btn-start");
  if (btnStart) btnStart.onclick = async () => {
    const val = document.getElementById("name-input").value.trim();
    if (!val) { document.getElementById("name-error").textContent="Please enter your name"; document.getElementById("name-error").style.display="block"; return; }
    // Check for existing response and pre-fill if found
    try {
      const data = await apiGet();
      const prior = data.responses.find(r => r.name.toLowerCase() === val.toLowerCase());
      const customs = data.customs || [];
      if (prior) {
        setState({ name: val, activityVotes: prior.activityVotes || {}, availability: prior.availability || {}, customActivities: customs, screen: "activities" });
      } else {
        setState({ name: val, activityVotes: {}, availability: {}, customActivities: customs, screen: "activities" });
      }
    } catch(e) {
      setState({ name: val, screen: "activities" });
      loadCustomActivities();
    }
  };
  const nameInput = document.getElementById("name-input");
  if (nameInput) nameInput.onkeydown = e => { if(e.key==="Enter") btnStart.click(); };
  const btnViewResults = document.getElementById("btn-view-results");
  if (btnViewResults) btnViewResults.onclick = () => { setState({ screen:"results", allData:null }); loadResults(); };

  // Activities screen
  document.querySelectorAll(".vote-btn").forEach(btn => {
    btn.onclick = () => {
      const id = btn.dataset.id, vote = btn.dataset.vote;
      setState({ activityVotes: { ...state.activityVotes, [id]: vote } });
    };
  });
  const btnNext = document.getElementById("btn-next-avail");
  if (btnNext) btnNext.onclick = () => setState({ screen:"availability" });
  const btnAdd = document.getElementById("btn-add-activity");
  if (btnAdd) btnAdd.onclick = async () => {
    const input = document.getElementById("new-activity-input");
    await addCustomActivity(input.value);
    input.value = "";
  };
  const newActInput = document.getElementById("new-activity-input");
  if (newActInput) newActInput.onkeydown = async e => { if(e.key==="Enter") { await addCustomActivity(e.target.value); e.target.value=""; } };

  // Availability screen
  const btnBack = document.getElementById("btn-back");
  if (btnBack) btnBack.onclick = () => setState({ screen:"activities" });
  document.querySelectorAll(".slot-btn").forEach(btn => {
    btn.onclick = () => {
      const date = btn.dataset.date, slot = btn.dataset.slot;
      const current = state.availability[date] || [];
      let next;
      if (slot === "Too Busy") {
        next = current.includes("Too Busy") ? [] : ["Too Busy"];
      } else {
        const withoutBusy = current.filter(s => s !== "Too Busy");
        next = withoutBusy.includes(slot) ? withoutBusy.filter(s=>s!==slot) : [...withoutBusy, slot];
      }
      setState({ availability: { ...state.availability, [date]: next } });
    };
  });
  const btnSubmit = document.getElementById("btn-submit");
  if (btnSubmit) btnSubmit.onclick = handleSubmit;

  // Results screen
  const tabAct = document.getElementById("tab-activities");
  if (tabAct) tabAct.onclick = () => setState({ activeTab:"activities" });
  const tabAvail = document.getElementById("tab-availability");
  if (tabAvail) tabAvail.onclick = () => setState({ activeTab:"availability" });
  const btnAnother = document.getElementById("btn-another");
  if (btnAnother) btnAnother.onclick = () => setState({ screen:"name", submitted:false });
  const btnRefresh = document.getElementById("btn-refresh");
  if (btnRefresh) btnRefresh.onclick = () => { setState({ allData:null }); loadResults(); };
}

render();
</script>
</body>
</html>
